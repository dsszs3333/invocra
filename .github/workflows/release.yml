name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libsecret-1-dev
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu -p invocra
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/invocra-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" -C target/x86_64-unknown-linux-gnu/release invocra
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Verify packaged binary
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/invocra-release-smoke"
          tar -xzf "dist/invocra-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/invocra-release-smoke"
          "$RUNNER_TEMP/invocra-release-smoke/invocra" --help
          test "$("$RUNNER_TEMP/invocra-release-smoke/invocra" --version)" = "invocra ${GITHUB_REF_NAME#v}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: invocra ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
