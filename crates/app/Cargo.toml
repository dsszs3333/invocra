[package]
name = "invocra"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Lazygit-style TUI dashboard for GitLab CI/CD pipelines across multiple instances"
keywords = ["gitlab", "ci", "tui", "pipelines", "devops"]
categories = ["command-line-utilities"]

[[bin]]
name = "invocra"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Heap profiling: builds dhat in as the global allocator. Off by default.
dhat-heap = ["dep:dhat"]

[dependencies]
dhat = { version = "0.3", optional = true }
anyhow.workspace = true
clap.workspace = true
config = { package = "invocra-config", path = "../config", version = "0.2.0" }
gitlab = { package = "invocra-gitlab", path = "../gitlab", version = "0.2.0" }
rpassword.workspace = true
storage = { package = "invocra-storage", path = "../storage", version = "0.2.0" }
tokio.workspace = true
tracing-subscriber.workspace = true
tui = { package = "invocra-tui", path = "../tui", version = "0.2.0" }
